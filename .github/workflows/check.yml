name: Check Instagram connection
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          G=https://graph.facebook.com/v21.0; IG=17841435471298040
          echo "--- debug"; curl -s "$G/debug_token?input_token=$T&access_token=$T" | python3 -c "import json,sys;d=json.load(sys.stdin)['data'];print({k:d.get(k) for k in ['type','is_valid','expires_at','data_access_expires_at']})"
          echo "--- me"; curl -s "$G/me?fields=id,name&access_token=$T"; echo
          echo "--- page ig"; curl -s "$G/1438488679354218?fields=instagram_business_account,tasks&access_token=$T"; echo
        env:
          T: ${{ secrets.IG_TOKEN }}
