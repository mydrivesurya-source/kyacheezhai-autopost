name: Build and publish to Instagram
on:
  schedule:
    - cron: "45 4 * * *"    # 10:15 AM IST  story
    - cron: "15 6 * * *"    # 11:45 AM IST  reel
    - cron: "45 7 * * *"    # 1:15 PM IST   story
    - cron: "45 9 * * *"    # 3:15 PM IST   carousel
    - cron: "45 10 * * *"   # 4:15 PM IST   extra product-only reel (alternate days)
    - cron: "45 11 * * *"   # 5:15 PM IST   story
    - cron: "15 14 * * *"   # 7:45 PM IST   reel
    - cron: "45 15 * * *"   # 9:15 PM IST   story
  push:
    paths: ["specs/**"]
  workflow_dispatch:
    inputs:
      prefix: {description: "Publish this queue file prefix now (optional)", required: false}
concurrency: {group: kch, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q pillow numpy
      - name: Build new specs
        run: python scripts/build.py
      - name: Save built media
        run: |
          git config user.name "kch-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A media queue && git commit -qm "Build media" && git push -q || echo "nothing built"
      - name: Publish due posts
        if: github.event_name != 'push'
        run: sleep 20 && python scripts/publish.py ${{ github.event.inputs.prefix }}
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: "17841435471298040"
      - name: Mark posted + refresh website
        if: github.event_name != 'push'
        run: |
          python scripts/site.py
          git add -A queue docs && git commit -qm "Mark posted" && git push -q || echo "nothing to commit"
