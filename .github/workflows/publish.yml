name: Publish to Instagram
on:
  schedule:
    - cron: "45 13 * * *"   # 7:15 PM IST
    - cron: "15 6 * * *"    # 11:45 AM IST
  workflow_dispatch:
    inputs:
      prefix: {description: "Queue file prefix to publish (default: today)", required: false}
permissions: {contents: write}
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/publish.py ${{ github.event.inputs.prefix }}
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: "17841435471298040"
      - run: |
          git config user.name "kch-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A queue && git commit -m "Mark posted" && git push || echo "nothing to commit"
